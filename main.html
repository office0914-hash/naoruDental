<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>なおる歯科 - 予約システム</title>
  <link rel="stylesheet" href="main.css">
  <link rel="stylesheet" href="header.css">
  <link rel="stylesheet" href="calendar.css">
  <link rel="stylesheet" href="reservationGrid.css">
  <link rel="stylesheet" href="systemSettings.css">
  <link rel="stylesheet" href="clinicHoliday.css">
  <link rel="stylesheet" href="leftClickActions.css">
  <link rel="stylesheet" href="gridBlock.css">
  <link rel="stylesheet" href="appNew.css">

  <!-- sql.js (Pure JS / Offline & File Protocol Ready) -->
  <script src="lib/sql-asm.js"></script>
</head>

<body>

  <!-- メインヘッダー：選択日付を表示 -->
  <header id="header">
    <div class="header-brand">
      <div class="header-logo-icon">🦷</div>
      <div class="header-logo-text">なおる<span>歯科</span> 予約管理</div>
    </div>

    <!-- カレンダー選択日付の表示ボックス -->
    <div class="header-date-box">
      <div id="headerSelectedDate" class="header-selected-date">
        <!-- JSで選択した日付がリアルタイム表示されます -->
      </div>
    </div>

    <!-- ブロックモード表示バッジ -->
    <div id="headerBlockModeBadge" class="header-block-mode-badge">
      <span class="lock-icon-pulse">🔒</span>
      <span>ブロックモード中（クリック/ドラッグで枠をブロック・解除）</span>
      <span class="badge-tag">Shift+B</span>
    </div>

    <!-- パイロットグリッド (新規予約キープ用スロット) -->
    <div class="pilot-grid-container" id="pilotGridContainer" title="クリックして予約内容・枠数を変更">
      <div class="pilot-grid-empty" id="pilotGridEmpty">
        <span class="pilot-empty-icon">📌</span>
        <span class="pilot-empty-text"></span>
      </div>
    </div>
  </header>

  <div class="app-body">
    <!-- 左側：カレンダー群 (450px幅・上下2連) -->
    <div class="calendars-sidebar">
      <div id="calendar" class="calendar-container"></div>
      <div id="calendar-next" class="calendar-container"></div>
    </div>

    <!-- 中央：予約グリッド (横5列 × 縦19行) -->
    <div id="reservationGrid" class="reservation-grid-container"></div>

    <!-- 右側：systemSettings (280px幅) -->
    <div id="systemSettings" class="system-settings">
      <button type="button" id="btnHolidaySettings" class="settings-btn">
        📅 休診日 設定
      </button>

      <!-- 右下角：電源ボタン（正方形・稼働中はライムネオン発光） -->
      <button type="button" id="btnSystemPower" class="power-btn is-running" title="システム終了" aria-label="システム電源">
        <svg class="power-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18.36 6.64a9 9 0 1 1-12.73 0"></path>
          <line x1="12" y1="2" x2="12" y2="12"></line>
        </svg>
      </button>
    </div>
  </div>

  <!-- システム終了確認 & 進捗オーバーレイ -->
  <div id="shutdownOverlay" class="shutdown-overlay" role="dialog" aria-modal="true">
    <div class="shutdown-card">
      <div class="shutdown-icon-wrap" id="shutdownIconWrap">🔌</div>
      <div class="shutdown-title" id="shutdownTitle">システムを終了しています</div>
      <div class="shutdown-step-list" id="shutdownStepList">
        <div class="shutdown-step step-running" id="stepIntegrity">
          <span class="shutdown-step-icon">🔄</span>
          <span class="shutdown-step-text">データベースの損傷・整合性を検証中...</span>
        </div>
        <div class="shutdown-step" id="stepBackup">
          <span class="shutdown-step-icon">⏳</span>
          <span class="shutdown-step-text">データベースのバックアップ保存を準備中...</span>
        </div>
        <div class="shutdown-step" id="stepShutdown">
          <span class="shutdown-step-icon">⏳</span>
          <span class="shutdown-step-text">システムの安全終了処理...</span>
        </div>
      </div>
      <div class="shutdown-btn-row" id="shutdownBtnRow" style="display: none;">
        <button type="button" class="shutdown-btn-close" id="btnFinalClose">ウィンドウを閉じる</button>
        <button type="button" class="shutdown-btn-restart" id="btnRestartSystem">再開する</button>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="main.js"></script>
  <script src="db.js"></script>
  <script src="calendar.js"></script>
  <script src="dragDropManager.js"></script>
  <script src="reservationGrid.js"></script>
  <script src="gridBlock.js"></script>
  <script src="clinicHoliday.js"></script>
  <script src="leftClickActions.js"></script>
  <script src="appNew.js"></script>
</body>

</html>
